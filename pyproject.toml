[project]
name = "incident-desk"
version = "0.1.0"
description = "A Django incident-management starter for an application-security course"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Django==5.2.18",
    "dj-database-url>=3,<4",
    "python-dotenv>=1.2,<2",
    "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "config.wsgi:application"
